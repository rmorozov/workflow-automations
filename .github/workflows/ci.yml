name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/backlog.py check
      - run: python scripts/agent_profiles.py check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            pandas: pandas==2.2.3
          - python: '3.12'
            pandas: pandas>=2.2,<3
          - python: '3.13'
            pandas: pandas>=3,<4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Kerberos build headers for the ADO graph tool
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - run: python -m pip install -e '.[translation,outline,team-roster,ado-triage,ado-graph,dev]' '${{ matrix.pandas }}'
      - run: pytest
      - run: python -m build
      - name: Install built wheel and smoke-test entry points
        run: |
          python -m pip uninstall -y workflow-automations
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          xlsx-translate --help
          python -m workflow_automations.xlsx_translation --help
          xlsx-outline --help
          python -m workflow_automations.xlsx_outline --help
          xlsx-unfold --help
          python -m workflow_automations.xlsx_unfold --help
          gerrit-parents --help
          python -m workflow_automations.gerrit_parents --help
          team-roster --help
          python -m workflow_automations.team_roster --help
          ado-graph --help
          ado-graph analyze --help
          python -m workflow_automations.ado_graph --help
          ado-triage --help
          python -m workflow_automations.ado_triage --help

  offline-analysis:
    # ado-graph analyze must install and run without the ADO SDK or Kerberos headers.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[ado-graph-analyze]'
      - name: Analyze synthetic tables with no network extras installed
        run: |
          cd "$(mktemp -d)"
          if python -c 'import azure.devops' 2>/dev/null; then exit 1; fi
          if python -c 'import requests_kerberos' 2>/dev/null; then exit 1; fi
          ado-graph --help
          ado-graph analyze --help
          python -c '
          import pandas as pd
          pd.DataFrame({"WI_ID": [1, 2], "Title": ["A", "B"], "WorkItemType": ["Feature"] * 2}).to_parquet("nodes.parquet")
          pd.DataFrame({"Source_ID": [1], "Target_ID": [2], "Link_Type": ["Parent->Child"]}).to_parquet("edges.parquet")
          '
          ado-graph analyze --nodes-file nodes.parquet --edges-file edges.parquet --output-file report.xlsx
          test -s report.xlsx
          set +e
          ado-graph export --ado-url https://ado.example --query-id synthetic 2> export.err
          status=$?
          set -e
          cat export.err
          test "$status" -eq 2 && grep -q "needs the 'ado-graph' extra" export.err
