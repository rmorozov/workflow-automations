[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-automations"
version = "0.1.0"
description = "Local helpers for engineering management routines"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
translation = ["pandas>=2.2,<4", "openpyxl>=3.1.5,<4"]
outline = ["openpyxl>=3.1.5,<4", "pyyaml>=6,<7"]
team-roster = ["pandas>=2.2,<4", "openpyxl>=3.1.5,<4"]
team-capacity = ["pandas>=2.2,<4", "openpyxl>=3.1.5,<4"]
ado-triage = ["pandas>=2.2,<4", "openpyxl>=3.1.5,<4", "azure-devops>=7.1.0b4,<8"]
# Separate: on Linux this builds gssapi and needs system Kerberos headers (libkrb5-dev).
ado-kerberos = ["requests-kerberos>=0.15,<1"]
# Offline graph analysis: no ADO SDK, no Kerberos.
ado-graph-analyze = ["pandas>=2.2,<4", "openpyxl>=3.1.5,<4", "networkx>=3,<4", "pyarrow>=15,<27"]
# Export as well; on Linux requests-kerberos builds gssapi (see ado-kerberos above).
ado-graph = ["workflow-automations[ado-graph-analyze]", "azure-devops>=7.1.0b4,<8",
             "msrest>=0.7.1,<0.8", "requests-kerberos>=0.15,<1", "certifi>=2024.2.2",
             "tqdm>=4,<5"]
# Every tool's runtime dependencies, including Kerberos (see ado-kerberos above).
all = ["workflow-automations[translation,outline,team-roster,team-capacity,ado-triage,ado-kerberos,ado-graph]"]
dev = ["pytest>=8,<10", "ruff==0.16.9", "build>=1.2,<2"]

[project.scripts]
xlsx-translate = "workflow_automations.xlsx_translation:main"
xlsx-outline = "workflow_automations.xlsx_outline:main"
xlsx-unfold = "workflow_automations.xlsx_unfold:main"
gerrit-parents = "workflow_automations.gerrit_parents:main"
team-roster = "workflow_automations.team_roster:main"
team-capacity = "workflow_automations.team_capacity:main"
team-capacity-calibrate = "workflow_automations.team_capacity_calibrate:main"
ado-triage = "workflow_automations.ado_triage:main"
ado-graph = "workflow_automations.ado_graph:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
